# Copy to ~/.config/diarystats/config.toml and adapt.
# Secrets do not go here. Put them in ~/.config/diarystats/env (mode 0600):
#   DIARYSTATS_RESCUETIME_KEY=...

timezone = "Europe/Berlin"
archive_dir = "~/lifelog"
# Pause between days during a backfill, in seconds.
throttle_seconds = 3

[diary]
# The same values as for the yearbox plugin, which creates the diary pages:
# namestructure from its setting in conf/local.php
# ($conf['plugin']['yearbox']['namestructure']), namespace and name from the
# tag {{yearbox>ns=...;name=...}}.
# namestructure: default, separatedCompletely, YearMonthSeperatedNS or YearNS.
namespace = "appreciation"
namestructure = "YearMonthSeperatedNS"
name = ""
stats_suffix = ":stats"

[links]
# Optional deep links in the rendered snippet. {date} is YYYY-MM-DD.
# Leave out or set to "" to omit a link.
garmin = "https://connect.garmin.com/modern/sleep/{date}"
rescuetime = "https://www.rescuetime.com/dashboard/for/the/day/of/{date}"

[garmin]
tokenstore = "~/.config/diarystats/garmin-tokens"

[sink]
# "file": write the pages to files in dir. "dwpage": save them in DokuWiki.
kind = "file"
# Keep this outside archive_dir: rendered text is derived data.
dir = "~/.local/share/diarystats/rendered"
# For kind = "dwpage". See deploy/diarystats-wiki-commit.
pages_dir = "/var/www/html/dokuwiki/data/pages"
command = ["sudo", "-n", "-u", "www-data", "/usr/local/bin/diarystats-wiki-commit"]

[alert]
backends = ["log"]
